# Generated by scripts/run_subsets.py: configs/train_advice.yaml on a 300-row subset.
model:
  base: unsloth/gemma-4-E4B-it
  max_seq_length: 2048
  load_in_4bit: true
lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
data:
  train_file: data/processed/subsets/advice_train_n300.jsonl
  val_file: data/processed/advice_val.jsonl
sft:
  output_dir: outputs/subsets/n300
  num_train_epochs: 3
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 38
  save_steps: 38
  bf16: true
  gradient_checkpointing: true
  seed: 42
  train_on_responses_only: true
  dataloader_num_workers: 0
  dataset_num_proc: 1
export:
  save_adapter: true
