# QLoRA config for the advice detector. Mirrors the judge repo's proven settings.
# Launch: bash train/run.sh python train/train_advice.py --config configs/train_advice.yaml
# Smoke:  bash train/run.sh python train/train_advice.py --config configs/train_advice.yaml --max-steps 20

model:
  base: "unsloth/gemma-4-E4B-it"   # same weights as google/gemma-4-E4B-it
  max_seq_length: 2048             # drafts are short; the judge needed 4096, we don't
  load_in_4bit: true

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

data:
  train_file: "data/processed/advice_train.jsonl"
  val_file: "data/processed/advice_val.jsonl"
  # advice_test.jsonl is never seen in training — it is the eval set.

sft:
  output_dir: "outputs/gemma4-e4b-advice"
  num_train_epochs: 3              # smaller dataset than the judge's, so more passes
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  optim: "adamw_8bit"
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 25
  save_steps: 25                   # = eval_steps: one checkpoint per val loss. Every
                                   # checkpoint is scored by scripts/eval_checkpoints.py
                                   # (F1 / accuracy on val+test) for the learning curve.
                                   # 25 steps x 8 = 200 rows, so epoch 1 gets 5 points.
                                   # The curve uses test, so the SHIPPED adapter is always
                                   # the final one — never pick a checkpoint off this curve.
  bf16: true
  gradient_checkpointing: true
  seed: 42
  train_on_responses_only: true    # healthy loss starts ~1-3. Loss exactly 0 (with
                                   # grad_norm 0) means the assistant-turn marker was
                                   # not found and every token got masked; ~13-15 means
                                   # masking broke the other way, training on the prompt.
  dataloader_num_workers: 0        # GB10: forked workers deadlock after CUDA init
  dataset_num_proc: 1

export:
  save_adapter: true
